# base-admin-core 后端敏感配置（覆盖镜像内 config.yaml）
#
# ${VAR} 由云效流水线在 kubectl apply 前替换；K8s 不解析，直接 apply 会保存
# 字面量，生产环境启动校验会拒绝。
#
# 必须定义：JWT_SECRET / DB_PASSWORD / REDIS_PASSWORD /
#           BOOTSTRAP_ADMIN_PASSWORD
#
# 也可用 kubectl create secret 生成，不要把结果提交到 Git：
#   kubectl -n base-admin create secret generic base-admin-backend-secret \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DB_PASSWORD='请替换为数据库口令' \
#     --from-literal=REDIS_PASSWORD='请替换为 Redis 口令' \
#     --from-literal=BOOTSTRAP_ADMIN_PASSWORD='请替换为首次管理员强密码'
#
# 命令中的 $(...) 是 shell 命令替换，不是云效变量，也不是 K8s 语法。
#
# BOOTSTRAP_ADMIN_PASSWORD 只在首次创建管理员时需要；留空则随机生成密码，
# 并在启动日志中打印一次。
apiVersion: v1
kind: Secret
metadata:
  name: base-admin-backend-secret
  labels:
    app.kubernetes.io/name: base-admin-core
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: base-admin
type: Opaque
stringData:
  JWT_SECRET: "${JWT_SECRET}"
  DB_PASSWORD: "${DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD}"
